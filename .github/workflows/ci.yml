name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      # `uv sync` above is non-frozen, so it silently tolerates a stale lock. The
      # release workflow runs `uv lock --check` + `uv sync --frozen` and hard-fails,
      # so without this step a forgotten `uv.lock` bump first surfaces at release.
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Lint
        run: |
          uv run black --check src tests
          uv run ruff check src tests
      - name: Schema drift guard
        run: |
          uv run python -m sleap_roots_contracts.schema
          git diff --exit-code schema/
      - name: Test
        run: uv run pytest --cov=src/sleap_roots_contracts --cov-report=term-missing -v

  # Spec validity was gated entirely on whoever happened to run the CLI locally, and on
  # which version answered. `openspec` is distributed via npx and the cached binary updates
  # in place, so the same tree has validated differently on different days — 1.9.0 -> 1.10.0
  # -> 1.11.0 over the course of a single change, and 1.11.0 added a check the earlier ones
  # did not have. That version drift already cost a full review round on #28, where 1.5.0 and
  # 1.6.0 disagreed about the same commit and two reviewers reached opposite conclusions.
  # The exact pin in package.json is what makes a green check here mean something specific.
  #
  # Its own job rather than a step in `test`: it is Python-independent, so running it once
  # per matrix leg would just install Node twice to compute the same answer.
  specs:
    name: Validate specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install the pinned OpenSpec CLI
        run: npm ci
      - name: Report the resolved version
        run: npx openspec --version
      - name: Validate all specs
        run: npx openspec validate --all --strict
